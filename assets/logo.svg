<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2D124D"/>
      <stop offset="50%" stop-color="#160829"/>
      <stop offset="100%" stop-color="#080312"/>
    </radialGradient>
    <radialGradient id="nebulaGlow" cx="50%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#6366F1" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#080312" stop-opacity="0"/>
    </radialGradient>
    <!-- Gold Gradients -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="35%" stop-color="#F59E0B"/>
      <stop offset="70%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <linearGradient id="goldLight" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="50%" stop-color="#FDF2E9"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="cyanCelestial" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
    <!-- Filter for Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="intenseGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base Circle Background -->
  <circle cx="512" cy="512" r="500" fill="url(#bgGrad)"/>
  <circle cx="512" cy="512" r="480" fill="url(#nebulaGlow)"/>

  <!-- Outer Astrological Zodiac / 12 Branch Ring -->
  <circle cx="512" cy="512" r="460" fill="none" stroke="url(#goldGrad)" stroke-width="4" opacity="0.8"/>
  <circle cx="512" cy="512" r="445" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-dasharray="6 6" opacity="0.6"/>
  <circle cx="512" cy="512" r="380" fill="none" stroke="url(#goldGrad)" stroke-width="3" opacity="0.7"/>

  <!-- 12 Radiating Palace Dividers (12 Cung Địa Bàn) -->
  <g stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.35">
    <line x1="512" y1="52" x2="512" y2="132"/>
    <line x1="512" y1="892" x2="512" y2="972"/>
    <line x1="52" y1="512" x2="132" y2="512"/>
    <line x1="892" y1="512" x2="972" y2="512"/>
    <line x1="187" y1="187" x2="243" y2="243"/>
    <line x1="781" y1="781" x2="837" y2="837"/>
    <line x1="837" y1="187" x2="781" y2="243"/>
    <line x1="243" y1="781" x2="187" y2="837"/>
    <line x1="742" y1="114" x2="702" y2="183"/>
    <line x1="282" y1="910" x2="322" y2="841"/>
    <line x1="282" y1="114" x2="322" y2="183"/>
    <line x1="742" y1="910" x2="702" y2="841"/>
    <line x1="910" y1="282" x2="841" y2="322"/>
    <line x1="114" y1="742" x2="183" y2="702"/>
    <line x1="114" y1="282" x2="183" y2="322"/>
    <line x1="910" y1="742" x2="841" y2="702"/>
  </g>

  <!-- 12 Star Nodes on the Outer Ring (representing Tí, Sửu, Dần, Mão, Thìn, Tị, Ngọ, Mùi, Thân, Dậu, Tuất, Hợi) -->
  <g fill="url(#goldLight)" filter="url(#glow)">
    <circle cx="512" cy="92" r="9"/>
    <circle cx="722" cy="148" r="7"/>
    <circle cx="876" cy="302" r="7"/>
    <circle cx="932" cy="512" r="9"/>
    <circle cx="876" cy="722" r="7"/>
    <circle cx="722" cy="876" r="7"/>
    <circle cx="512" cy="932" r="9"/>
    <circle cx="302" cy="876" r="7"/>
    <circle cx="148" cy="722" r="7"/>
    <circle cx="92" cy="512" r="9"/>
    <circle cx="148" cy="302" r="7"/>
    <circle cx="302" cy="148" r="7"/>
  </g>

  <!-- Middle Astrolabe / Celestial Coordinates Ring -->
  <circle cx="512" cy="512" r="320" fill="none" stroke="url(#cyanCelestial)" stroke-width="2.5" opacity="0.6"/>
  <circle cx="512" cy="512" r="300" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-dasharray="3 9" opacity="0.5"/>

  <!-- Sacred Geometry: Double Intersecting Gold Squares (Bát Quái Octagram Framework) -->
  <g stroke="url(#goldGrad)" stroke-width="2" fill="none" opacity="0.45">
    <rect x="292" y="292" width="440" height="440" rx="4"/>
    <rect x="292" y="292" width="440" height="440" rx="4" transform="rotate(45 512 512)"/>
  </g>

  <!-- Central Starfield Constellation Lines -->
  <g stroke="#C084FC" stroke-width="1" opacity="0.3">
    <line x1="512" y1="230" x2="420" y2="400"/>
    <line x1="420" y1="400" x2="350" y2="512"/>
    <line x1="512" y1="230" x2="604" y2="400"/>
    <line x1="604" y1="400" x2="674" y2="512"/>
    <line x1="350" y1="512" x2="420" y2="624"/>
    <line x1="674" y1="512" x2="604" y2="624"/>
    <line x1="420" y1="624" x2="512" y2="794"/>
    <line x1="604" y1="624" x2="512" y2="794"/>
  </g>

  <!-- Inner Mystic Disk -->
  <circle cx="512" cy="512" r="220" fill="#140728" stroke="url(#goldGrad)" stroke-width="4" filter="url(#glow)"/>

  <!-- Yin Yang / Thái Cực Celestial Centerpiece -->
  <g transform="translate(512,512) scale(1.15)">
    <!-- Outer Yin-Yang Halo -->
    <circle cx="0" cy="0" r="140" fill="#0C0418" stroke="url(#goldLight)" stroke-width="3"/>
    
    <!-- Light Yang Half (Gold Gradient) -->
    <path d="M 0,-140 A 140,140 0 0,1 0,140 A 70,70 0 0,1 0,0 A 70,70 0 0,0 0,-140 Z" fill="url(#goldGrad)"/>
    
    <!-- Dark Yin Half (Deep Violet) -->
    <path d="M 0,-140 A 140,140 0 0,0 0,140 A 70,70 0 0,0 0,0 A 70,70 0 0,1 0,-140 Z" fill="#180A2E"/>

    <!-- Yang Dot (Golden Star in Yin) -->
    <circle cx="0" cy="70" r="22" fill="url(#goldLight)" filter="url(#glow)"/>
    <!-- Yin Dot (Deep Violet Star in Yang) -->
    <circle cx="0" cy="-70" r="22" fill="#140728" stroke="url(#goldGrad)" stroke-width="3"/>

    <!-- Central Tử Vi Emperor Star (Polaris 8-Pointed Star) -->
    <g filter="url(#intenseGlow)">
      <!-- Star Ray 1 -->
      <polygon points="0,-165 14,-30 0,-10 -14,-30" fill="url(#goldLight)"/>
      <polygon points="0,165 14,30 0,10 -14,30" fill="url(#goldLight)"/>
      <polygon points="-165,0 -30,14 -10,0 -30,-14" fill="url(#goldLight)"/>
      <polygon points="165,0 30,14 10,0 30,-14" fill="url(#goldLight)"/>
      <!-- Diagonal Rays -->
      <polygon points="-110,-110 -18,-35 0,0 -35,-18" fill="url(#cyanCelestial)"/>
      <polygon points="110,110 18,35 0,0 35,18" fill="url(#cyanCelestial)"/>
      <polygon points="110,-110 18,-35 0,0 35,-18" fill="url(#cyanCelestial)"/>
      <polygon points="-110,110 -18,35 0,0 -35,18" fill="url(#cyanCelestial)"/>
      <!-- Sparkling Center Diamond -->
      <polygon points="0,-22 22,0 0,22 -22,0" fill="#FFFFFF"/>
    </g>
  </g>

  <!-- Mystic Corner Flares -->
  <circle cx="512" cy="512" r="6" fill="#FFFFFF" filter="url(#intenseGlow)"/>
</svg>

